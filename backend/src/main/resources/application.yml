spring:
  ai:
    model:
      chat: bedrock-converse
    bedrock:
      aws:
        region: ${AWS_REGION:eu-central-1}
        timeout: 15m
        connection-timeout: 15s
        connection-acquisition-timeout: 30s
        async-read-timeout: 180s
        socket-timeout: 300s
        max-retries: 5
      converse:
        chat:
          model: arn:aws:bedrock:eu-central-1:495526667185:inference-profile/eu.anthropic.claude-haiku-4-5-20251001-v1:0
          temperature: 0.2
          max-tokens: 32000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://db:5432/garbagereporter
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  profiles:
    active: bedrock
  web:
    resources:
      static-locations: file:/app/uploads/
  mvc:
    static-path-pattern: /**
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8010

garbage-reporter:
  ai:
    cron: ${AI_CRON:0 0 2 * * *}

logging:
  level:
    org.springframework.boot.autoconfigure.liquibase: DEBUG
    liquibase: DEBUG